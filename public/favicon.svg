<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none">
  <!-- Solid Black Background -->
  <rect width="48" height="32" rx="10" fill="#000000"/>

  <defs>
    <!-- Left Loop: Golden Amber to Warm Tangerine Flame Ribbon -->
    <linearGradient id="favGoldFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Right Loop: Fiery Magenta / Crimson to Ruby Rose -->
    <linearGradient id="favCrimsonFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Inner Core White Shimmer -->
    <linearGradient id="favShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g transform="translate(1, 1)">
    <!-- 1. LEFT GOLDEN LOOP: Infinity loop curves up-left, sweeps down and passes through center -->
    <path d="M 23,15 C 18,7 9.5,7 4.5,12 C -0.5,17 2.5,23.5 9,24 C 15.5,24.5 19.5,19 23,15" 
          stroke="url(#favGoldFlame)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 23,15 C 18,7 9.5,7 4.5,12 C -0.5,17 2.5,23.5 9,24 C 15.5,24.5 19.5,19 23,15" 
          stroke="url(#favShimmer)" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- 2. RIGHT CRIMSON LOOP TO HEART: From center crossing up-right, looping around to form the full heart -->
    <!-- The outer top curve of the right loop arching over -->
    <path d="M 23,15 C 27,10 33,8.5 38.5,11.5 C 41.5,13.5 42,17 38.5,20.5 L 37.2,21.8 C 36.8,21.5 35.8,18 37.2,15.5 C 38.8,12.5 42.5,12.5 44,15.5 C 45.2,17.8 44.5,21.2 38,27.5 C 32,21.5 30.5,17.5 32.2,15.2 C 33.8,13 37.2,13.5 37.5,17" 
          stroke="url(#favCrimsonFlame)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Delicate white neon filament highlight tracing the heart curves -->
    <path d="M 23,15 C 27,10 33,8.5 38.5,11.5 C 41.5,13.5 42,17 38.5,20.5 L 37.2,21.8 C 36.8,21.5 35.8,18 37.2,15.5 C 38.8,12.5 42.5,12.5 44,15.5 C 45.2,17.8 44.5,21.2 38,27.5 C 32,21.5 30.5,17.5 32.2,15.2 C 33.8,13 37.2,13.5 37.5,17" 
          stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  </g>
</svg>
